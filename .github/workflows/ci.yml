name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm comes from the version pinned in package.json ("packageManager").
      - name: Enable Corepack
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The report is generated, never written by hand: regenerating it must not change it.
      - name: Validate and check the report is unchanged
        run: |
          pnpm validate > /dev/null
          git diff --exit-code -- packages/validation/report/

      - name: Build the app
        run: pnpm --filter @jet-workshop/web build
